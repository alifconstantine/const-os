set default=0
set timeout=5

menuentry 'ConstOS Live (CachyOS BORE)' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore.img
}

menuentry 'ConstOS Live (console fallback)' {
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-bore archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.unit=multi-user.target
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-bore.img
}
