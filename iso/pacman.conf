[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# Keep the live image's ConstOS release metadata when installing CachyOS hooks.
NoExtract = usr/share/libalpm/hooks/cachyos-branding.hook
NoExtract = usr/share/libalpm/hooks/lsb-release.hook
NoExtract = usr/share/libalpm/hooks/os-release.hook

# Use generic x86_64 packages for the live image. Keep the same signed
# repositories available during the build and in the live session.
[cachyos]
Server = https://us.cachyos.org/repo/$arch/$repo
Server = https://mirror.lesviallon.fr/cachy/repo/$arch/$repo
Server = https://nl.mirror.cx/cachyos/repo/$arch/$repo
Server = https://cdn77.cachyos.org/repo/$arch/$repo

[core]
Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[multilib]
Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
