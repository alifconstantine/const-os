#
# /etc/pacman.conf - ConstOS Live ISO Pacman Configuration
#

[options]
HoldPkg     = pacman glibc
Architecture = auto

Color
ILoveCandy
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 8
DisableSandbox

SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

# -----------------------------------------------------------------------------
# ConstOS Local Packages Repository (Const Harness & Internal Daemons)
# -----------------------------------------------------------------------------
[constos-local]
SigLevel = Optional TrustAll
Server = file:///packages/local-repo
Server = file://$PWD/packages/local-repo
Server = file://$PWD/../packages/local-repo

# -----------------------------------------------------------------------------
# CachyOS Optimized Repositories (x86-64-v3 / v4 & BORE Kernel)
# -----------------------------------------------------------------------------
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# -----------------------------------------------------------------------------
# Arch Linux Standard Repositories
# -----------------------------------------------------------------------------
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
